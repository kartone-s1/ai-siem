// =====================================================================
// NetApp ONTAP - kern_audit management-plane audit records over syslog
// =====================================================================
//
// Wire shape (one line; a BSD syslog frame wrapping an ONTAP EMS record,
// which in turn wraps a "::"-delimited kern_audit record):
//
//   <PRI>MMM  D HH:MM:SS <node>: <node>: <seq> <thread>
//     <EEE MMM DD YYYY HH:MM:SS +HH:MM> [kern_audit:<sev>:<pid>]
//     <audit_uid> :: <vserver>:<app> :: <clientip>:<port> ::
//     <vserver>:<user> :: <operation> :: <state>
//
// Every kern_audit record in this stream is an authentication decision on
// the ONTAP management plane (SNMP community auth, ONTAPI/HTTP basic auth,
// SSH login), so those records emit OCSF Authentication (3002). See the
// handoff for why activity_id is a constant 1 (Logon).
//
// Two record bodies exist:
//   "<audit_uid> :: ... :: <state>"  -> ontapAudit    -> 3002
//   "TIME_INFO::{node,tz,time}..."   -> ontapTimeInfo -> no OCSF class
//                                       (cluster clock heartbeat)
//
// ---------------------------------------------------------------------
// v1.1.0 - three fixes from Test Parser output on the live tenant:
//
// 1. The audit record is now sliced by `rewrites:` against `message`,
//    NOT by field matchers in a fragment format. The previous
//    ".*\] $a$ :: $b$:$c$ :: ..." fragment silently matched NOTHING on
//    the tenant, so no OCSF fields and no class tagging were emitted.
//    Fragment formats carrying many captures proved unreliable here,
//    while no-capture fragments (ontapAuthFailure, ontapTimeInfo) and
//    rewrites-against-message both worked. This version uses only the
//    mechanisms the tenant demonstrated. Every field comes from ONE
//    shared skeleton regex reused per output, so no rewrite depends on
//    another rewrite's output.
//
// 2. TIMESTAMP: the tenant rejected "Aug 03 2026 11:30:33 +00:00"
//    ("not a recognized format"), silently falling every event back to
//    ingest time. The EMS timestamp is now rebuilt as unambiguous
//    ISO 8601 ("2026-08-03T11:30:33+00:00"). A regex cannot map a month
//    NAME to a number, so there is one rewrite per month; exactly one
//    fires and the other eleven are silent no-ops.
//
// 3. skipNumericConversion on the frame: the EMS sequence id was being
//    coerced to a float when it happened to look like scientific
//    notation ("00000010.00449e02" -> 1000.449). The flag keeps these
//    opaque ids as strings. src_endpoint.port is cast back to int in
//    mappings, since OCSF types it as an integer.
// ---------------------------------------------------------------------

{
  timezone: "UTC",

  attributes: {
    // ---- 4 mandatory ----
    "dataSource.category": "security",
    "dataSource.name":     "ONTAP",
    "dataSource.vendor":   "NetApp",
    "metadata.version":    "1.1.1",

    "metadata.product.vendor_name": "NetApp",
    "metadata.product.name":        "ONTAP",
    "metadata.log_provider":        "kern_audit"
  },

  patterns: {
    // BSD syslog header time: "Aug  3 11:30:34" (day is space-padded).
    bsdTs:    "\\w{3}\\s+\\d{1,2} \\d{2}:\\d{2}:\\d{2}",
    // ONTAP EMS time: "Mon Aug 03 2026 11:30:33 +00:00"
    ontapTs:  "\\w{3} \\w{3} \\d{2} \\d{4} \\d{2}:\\d{2}:\\d{2} [+-]\\d{2}:\\d{2}",
    // Cluster node / vserver name. Excludes ':' so it self-bounds on the
    // trailing colon of the syslog and EMS host fields.
    nodeTok:  "[A-Za-z0-9_.-]+",
    // "00000016.0046b649" EMS sequence; bare hex thread id.
    seqTok:   "[0-9a-fA-F.]+",
    hexTok:   "[0-9a-fA-F]+",
    wordTok:  "[A-Za-z0-9_]+"
  },

  formats: [

    // ---- 1. Syslog + EMS frame ------------------------------------------
    // PROVEN on tenant: matches every line and captures all 10 fields.
    // Stops at the closing ']' of the EMS tag, so no capture here is ever
    // optional. skipNumericConversion protects the opaque ids.
    {
      id: "ontapFrame",
      skipNumericConversion: true,
      format: "<$unmapped.syslog_pri=digits$>$unmapped.syslog_time=bsdTs$ $unmapped.relay_host=nodeTok$: $device.hostname=nodeTok$: $unmapped.ems_seq=seqTok$ $unmapped.ems_thread=hexTok$ $metadata.original_time=ontapTs$ \\[$unmapped.ems_subsystem=wordTok$:$unmapped.ems_severity=wordTok$:$unmapped.ems_pid=digits$\\] ",
      rewrites: [
        // EMS time -> ISO 8601 event time. One rewrite per month name:
        // regex cannot translate "Aug" to "08", and a 12-way chain of
        // in-place edits would be harder to reason about than 12
        // independent rules of which exactly one matches.
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Jan (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-01-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Feb (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-02-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Mar (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-03-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Apr (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-04-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ May (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-05-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Jun (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-06-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Jul (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-07-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Aug (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-08-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Sep (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-09-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Oct (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-10-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Nov (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-11-$1T$3$4", outputIfNoMatch: false },
        { input: "metadata.original_time", output: "timestamp",
          match: "^\\w+ Dec (\\d{2}) (\\d{4}) ([0-9:]+) ([+-]\\d{2}:\\d{2})$",
          replace: "$2-12-$1T$3$4", outputIfNoMatch: false }
      ]
    },

    // ---- 2. Failure detector (sentinel only, no halt) -------------------
    // ONTAP prefixes every failing audit state with "Error: ". Kept as its
    // own non-halting, capture-free fragment so the outcome is decided by
    // a literal match rather than by a mappings predicate (which can only
    // test equality, so cannot express "starts with").
    // PROVEN on tenant: emits ontapAuthFailure = true.
    {
      id: "ontapAuthFailure",
      format: ".* :: Error: "
    },

    // ---- 3. kern_audit record -> Authentication (3002) ------------------
    // Capture-free fragment: " :: " (space-colon-colon-space) appears only
    // in audit records. The EMS tag "[kern_audit:info:3529]" has no spaces
    // around its colons, and TIME_INFO uses "::" with no spaces, so
    // neither can false-match here.
    //
    // All nine fields come from ONE skeleton regex against `message`,
    // reused once per output. Nothing depends on another rewrite's output,
    // so a miss in any single rule cannot cascade.
    {
      id: "ontapAudit",
      halt: true,
      // v1.1.1: the SSH placeholder audit uid ("0000000000000000") was
      // being coerced to the integer 0, making this field an int on SSH
      // records and a string everywhere else. The flag also keeps
      // status_code and http_request.version as strings, which is what
      // OCSF types them as. src_endpoint.port is cast back to int in
      // mappings, so the numeric field that should stay numeric does.
      skipNumericConversion: true,
      attributes: {
        class_uid:     3002,
        class_name:    "Authentication",
        category_uid:  3,
        category_name: "Identity & Access Management",
        activity_id:   1,
        activity_name: "Logon",
        type_uid:      300201        // class_uid * 100 + activity_id
      },
      format: ".* :: ",
      rewrites: [
        // Skeleton groups, in order:
        //   1 audit_uid  2 vserver  3 app    4 client_ip  5 client_port
        //   6 user_vserver  7 user  8 operation  9 state
        { input: "message", output: "unmapped.audit_uid",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.vserver",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$2", outputIfNoMatch: false },
        { input: "message", output: "service.name",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$3", outputIfNoMatch: false },
        { input: "message", output: "src_endpoint.ip",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$4", outputIfNoMatch: false },
        { input: "message", output: "src_endpoint.port",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$5", outputIfNoMatch: false },
        { input: "message", output: "unmapped.user_vserver",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$6", outputIfNoMatch: false },
        // ONTAP logs bare usernames in this source (admin, public,
        // ArubaAP, and SNMP community strings). An AD-authenticated admin
        // would arrive as "DOMAIN\user" and land here whole; split it
        // downstream if that ever appears.
        { input: "message", output: "actor.user.name",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$7", outputIfNoMatch: false },
        { input: "message", output: "unmapped.operation",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$8", outputIfNoMatch: false },
        { input: "message", output: "status_detail",
          match: "^.*\\] ([0-9a-fA-F]+) :: ([^ :]+):([^ ]+) :: ([^ :]+):(\\d+) :: ([^ :]+):([^ ]+) :: (.+) :: (.+)$",
          replace: "$9", outputIfNoMatch: false },

        // ONTAPI records carry an HTTP request line in <operation> and an
        // HTTP status in <state>. Independent of the skeleton above: on
        // SNMP and SSH records these four simply do not match.
        { input: "message", output: "http_request.http_method",
          match: "^.* :: ([A-Z]+) /[^ ]* HTTP/[0-9.]+ :: .*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "http_request.url.path",
          match: "^.* :: [A-Z]+ (/[^ ]*) HTTP/[0-9.]+ :: .*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "http_request.version",
          match: "^.* :: [A-Z]+ /[^ ]* HTTP/([0-9.]+) :: .*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "status_code",
          match: "^.* :: Error: (\\d+) [A-Za-z].*$",
          replace: "$1", outputIfNoMatch: false }
      ]
    },

    // ---- 4. Cluster clock heartbeat -> no OCSF class --------------------
    // "TIME_INFO::{node,tz,time}{node,tz,time}" - an internal time-sync
    // notice with no actor, no client and no auth decision. Kept rather
    // than discarded so the record stays searchable; flip `discard` to
    // true to drop it (discarded events do not count toward log volume).
    // PROVEN on tenant: matched, and the rewrite populated the payload.
    {
      id: "ontapTimeInfo",
      halt: true,
      discard: false,
      format: ".*\\] TIME_INFO::",
      rewrites: [
        { input:   "message",
          output:  "unmapped.time_info",
          match:   "^.*TIME_INFO::([^\\r\\n]+)$",
          replace: "$1" }
      ]
    }
  ],

  mappings: {
    version: 1,
    mappings: [
      {
        // ---- kern_audit -> Authentication (3002) ------------------------
        predicate: "ontapAudit == 'true'",
        transformations: [
          { constant: { field: "is_remote", value: true } },

          // OCSF types port as an integer; the rewrite above yields text.
          { cast: { field: "src_endpoint.port", type: "int" } },

          // The cluster being authenticated against.
          { copy: { from: "device.hostname", to: "dst_endpoint.hostname" } },

          // auth_protocol: ONTAP's application tag is the closest the
          // source gives us. None of SNMP / ONTAPI / SSH exist in the OCSF
          // auth_protocol_id enum, hence 99 (Other) with the real protocol
          // name carried in the sibling string.
          { constant: { field: "auth_protocol_id", value: 99 } },
          { constant: { field: "auth_protocol", value: "SNMP",
                        predicate: "service.name == 'snmp'" } },
          { constant: { field: "auth_protocol", value: "ONTAPI",
                        predicate: "service.name == 'ontapi'" } },
          { constant: { field: "auth_protocol", value: "SSH",
                        predicate: "service.name == 'ssh'" } },

          // Outcome, driven by the ontapAuthFailure format sentinel.
          { constant: { field: "status",    value: "Success" } },
          { constant: { field: "status_id", value: 1 } },
          { constant: { field: "status",    value: "Failure",
                        predicate: "ontapAuthFailure == 'true'" } },
          { constant: { field: "status_id", value: 2,
                        predicate: "ontapAuthFailure == 'true'" } },

          // Drop the format-id sentinels so they do not ship on the event.
          { drop: { field: "ontapFrame" } },
          { drop: { field: "ontapAudit" } },
          { drop: { field: "ontapAuthFailure" } }
        ]
      },
      {
        // ---- TIME_INFO heartbeat ---------------------------------------
        predicate: "ontapTimeInfo == 'true'",
        transformations: [
          { drop: { field: "ontapFrame" } },
          { drop: { field: "ontapTimeInfo" } }
        ]
      }
    ]
  },

  // The raw line adds nothing once the record is decomposed. NOTE: Test
  // Parser always displays `message` regardless of this setting; live
  // ingest does drop it.
  discardAttributes: ["message"]
}
