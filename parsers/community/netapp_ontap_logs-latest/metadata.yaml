metadata_details:
  purpose: "Parser for NetApp ONTAP kern_audit records over BSD syslog, normalised to OCSF Authentication (3002)."
  datasource_vendor: "NetApp"
  dataSource: "ONTAP"
  format: "syslog"
  ingestion_method: syslog
  dependency_summary: "Requires ONTAP EMS event forwarding to a syslog destination with kern_audit enabled."
  performance_impact: "Minimal - one frame match plus one fragment match and a few rewrites."
  tags: "netapp, ontap, kern_audit, storage, syslog, ocsf, parser"
  version: "1.1.1"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
