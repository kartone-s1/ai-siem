metadata_details:
  purpose: "Parser for Dell EMC PowerVault ME array syslog (RFC 5424) and HPE iLO 5 events, with authentication events normalised to OCSF Authentication (3002)."
  datasource_vendor: "Dell EMC"
  dataSource: "PowerVault ME"
  format: "syslog"
  ingestion_method: syslog
  dependency_summary: "Requires array syslog notification and iLO 5 remote syslog to be enabled."
  performance_impact: "Minimal - one frame match per shape plus a repeating key=value extractor."
  tags: "dell, emc, powervault, hpe, ilo, storage, syslog, rfc5424, ocsf, parser"
  version: "2.0.0"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
