metadata_details:
  purpose: "Parser for Synology DSM Log Center syslog, normalised to OCSF SMB Activity, Authentication and File System Activity."
  datasource_vendor: "Synology"
  dataSource: "DSM"
  format: "syslog"
  ingestion_method: syslog
  dependency_summary: "Requires DSM Log Center syslog forwarding with the Connection and WinFileService logs enabled."
  performance_impact: "Minimal - one frame match plus at most one body fragment match per line."
  tags: "synology, dsm, nas, smb, syslog, ocsf, parser"
  version: "2.0.1"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
