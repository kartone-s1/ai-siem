// =====================================================================
// Synology DSM - Log Center syslog forwarding
// =====================================================================
//
// Wire shape: plain BSD syslog, message body is human-readable prose with
// bracketed values. Five body shapes, fanned out to three OCSF classes
// plus one deliberately unclassified shape:
//
//   Connection: User [u] from [host(ip)] via [CIFS(SMB3)]
//               accessed shared folder [share].      -> 4006 SMB Activity
//   Connection: Host [ip] failed to connect via [SMB]
//               due to [SMB1 not permitted].         -> 4006 SMB Activity
//   Connection: User [u] from [ip] failed to log in
//               via [SSH] due to <reason>.           -> 3002 Authentication
//   WinFileService Event: <op>, Path: <p>, File/Folder: <t>,
//               Size: <s>, User: <u>, IP: <ip>       -> 1001 File System Activity
//   <System|NetworkBackup> SYSTEM:<TAB><text>        -> no OCSF class
//
// ---------------------------------------------------------------------
// v2.0.0 - STRUCTURAL REWRITE, before first tenant test.
//
// The NetApp ONTAP parser in this same batch proved that a FRAGMENT
// format (one whose pattern starts with ".*") carrying field matchers
// silently matches NOTHING on the tenant, while capture-free fragments
// and rewrites-against-`message` both work reliably. v1.0.0 of this
// parser used multi-capture fragments for four of its six formats, so it
// would almost certainly have emitted no OCSF fields at all.
//
// This version therefore uses ONLY the two mechanisms the tenant
// demonstrated:
//   * ONE line-start-anchored frame format holds the syslog header.
//   * Every body shape is a CAPTURE-FREE fragment that exists purely to
//     set its format-id sentinel and its OCSF class attributes.
//   * Every body field is sliced by a `rewrites:` rule reading `message`,
//     one shared skeleton regex per shape reused once per output.
// No rewrite reads another rewrite's output, so a miss cannot cascade.
//
// Where two rules write the same field, the LATER one wins and acts as a
// conditional override (used for DOMAIN\user splitting, the rename-arrow
// path split, and trailing-full-stop trimming). This avoids chaining,
// which is documented but not yet confirmed on this tenant.
// ---------------------------------------------------------------------
//
// NOTE on the client IP for file operations: OCSF 1.6.0 class 1001
// (File System Activity) has NO src_endpoint object - only `device`.
// The NAS is the device, so the SMB client's IP has no standard home on
// that class and is carried as unmapped.client_ip. See the handoff.
//
// TIMESTAMP: CONFIRMED on the tenant 2026-09-17. BSD syslog headers
// carry no year and no offset, so `timestamp` receives "MMM d HH:mm:ss";
// SDL accepts that form and infers the year correctly ("Aug 3 12:35:40"
// -> Mon Aug 3, 2026 12:35:40 GMT). The raw header is kept in
// unmapped.syslog_time. Set `timezone` below to the NAS timezone - it is
// UTC here pending confirmation, and since the header carries no offset
// this setting is what decides the absolute time of every event.

{
  timezone: "UTC",

  attributes: {
    // ---- 4 mandatory ----
    "dataSource.category": "security",
    "dataSource.name":     "DSM",
    "dataSource.vendor":   "Synology",
    "metadata.version":    "2.0.1",

    "metadata.product.vendor_name": "Synology",
    "metadata.product.name":        "DSM",
    "metadata.log_provider":        "Log Center"
  },

  patterns: {
    // "Aug  3 12:35:40" - day is space-padded.
    bsdTs:   "\\w{3}\\s+\\d{1,2} \\d{2}:\\d{2}:\\d{2}",
    hostTok: "[A-Za-z0-9_.-]+"
  },

  formats: [

    // ---- 1. Syslog frame ------------------------------------------------
    // Line-start-anchored with three always-present captures: the shape
    // the tenant proved on ONTAP. skipNumericConversion keeps the syslog
    // priority a string rather than letting it be type-guessed.
    {
      id: "dsmFrame",
      skipNumericConversion: true,
      format: "<$unmapped.syslog_pri=digits$>$unmapped.syslog_time=bsdTs$ $device.hostname=hostTok$ ",
      rewrites: [
        // Normalise the space-padded day ("Aug  3" -> "Aug 3") on the way
        // into `timestamp`; the raw header stays in unmapped.syslog_time.
        { input:   "unmapped.syslog_time",
          output:  "timestamp",
          match:   "^(\\w{3})\\s+(\\d{1,2}) ([0-9:]+)$",
          replace: "$1 $2 $3" }
      ]
    },

    // ---- 2. SMB share access -> SMB Activity (4006) ----------------------
    // "Connection: User [EXAMPLE\\jdoe] from [WKS01(192.0.2.10)]
    //  via [CIFS(SMB3)] accessed shared folder [SHARE01]."
    {
      id: "dsmShareAccess",
      halt: true,
      attributes: {
        class_uid:     4006,
        class_name:    "SMB Activity",
        category_uid:  4,
        category_name: "Network Activity",
        // OCSF 4006 activity_id is an SMB create-disposition enum
        // (File Supersede / Open / Create / ...). A tree connect is not
        // in it, so 99 (Other), with the vendor verb kept in mappings.
        activity_id:   99,
        activity_name: "Other",
        type_uid:      400699,
        share_type:    "Disk",
        share_type_id: 1,
        status:        "Success",
        status_id:     1,
        severity_id:   1
      },
      format: ".* accessed shared folder \\[",
      rewrites: [
        // Shared skeleton. Groups:
        //   1 user  2 client hostname (may be EMPTY)  3 client ip
        //   4 smb service  5 dialect  6 share
        { input: "message", output: "actor.user.name",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^(]*)\\(([^)]+)\\)\\] via \\[([^(]+)\\(([^)]+)\\)\\] accessed shared folder \\[([^\\]]+)\\].*$",
          replace: "$1", outputIfNoMatch: false },
        // Client NetBIOS name. NOT taken from the shared skeleton: DSM
        // emits "from [(ip)]" with an empty name for service-account
        // connections, and the skeleton's [^(]* would match empty and
        // write an empty string. This rule requires at least one
        // character, so on those lines it simply does not fire and the
        // field is absent rather than present-and-blank.
        { input: "message", output: "src_endpoint.hostname",
          match: "^.*Connection: User \\[[^\\]]+\\] from \\[([^(\\]]+)\\([0-9.]+\\)\\] via \\[.*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "src_endpoint.ip",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^(]*)\\(([^)]+)\\)\\] via \\[([^(]+)\\(([^)]+)\\)\\] accessed shared folder \\[([^\\]]+)\\].*$",
          replace: "$3", outputIfNoMatch: false },
        { input: "message", output: "unmapped.smb_service",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^(]*)\\(([^)]+)\\)\\] via \\[([^(]+)\\(([^)]+)\\)\\] accessed shared folder \\[([^\\]]+)\\].*$",
          replace: "$4", outputIfNoMatch: false },
        { input: "message", output: "dialect",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^(]*)\\(([^)]+)\\)\\] via \\[([^(]+)\\(([^)]+)\\)\\] accessed shared folder \\[([^\\]]+)\\].*$",
          replace: "$5", outputIfNoMatch: false },
        { input: "message", output: "share",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^(]*)\\(([^)]+)\\)\\] via \\[([^(]+)\\(([^)]+)\\)\\] accessed shared folder \\[([^\\]]+)\\].*$",
          replace: "$6", outputIfNoMatch: false },

        // DOMAIN\user override. Matches ONLY when a backslash is present,
        // so it re-writes actor.user.name (set above to the raw value) to
        // just the account, and adds the domain. Later rule wins, so no
        // rewrite-to-rewrite chaining is needed.
        { input: "message", output: "actor.user.domain",
          match: "^.*Connection: User \\[([^\\\\]+)\\\\([^\\]]+)\\].*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "actor.user.name",
          match: "^.*Connection: User \\[([^\\\\]+)\\\\([^\\]]+)\\].*$",
          replace: "$2", outputIfNoMatch: false }
      ]
    },

    // ---- 3. SMB connection rejected -> SMB Activity (4006) ---------------
    // "Connection: Host [192.0.2.20] failed to connect via [SMB]
    //  due to [SMB1 not permitted]."
    // A protocol-negotiation refusal, not a credential check, so it stays
    // on the SMB class rather than becoming an Authentication failure.
    {
      id: "dsmShareReject",
      halt: true,
      attributes: {
        class_uid:     4006,
        class_name:    "SMB Activity",
        category_uid:  4,
        category_name: "Network Activity",
        activity_id:   99,
        activity_name: "Other",
        type_uid:      400699,
        status:        "Failure",
        status_id:     2,
        severity_id:   2
      },
      format: ".*Connection: Host \\[",
      rewrites: [
        { input: "message", output: "src_endpoint.ip",
          match: "^.*Connection: Host \\[([^\\]]+)\\] failed to connect via \\[([^\\]]+)\\] due to \\[([^\\]]+)\\].*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.smb_service",
          match: "^.*Connection: Host \\[([^\\]]+)\\] failed to connect via \\[([^\\]]+)\\] due to \\[([^\\]]+)\\].*$",
          replace: "$2", outputIfNoMatch: false },
        { input: "message", output: "status_detail",
          match: "^.*Connection: Host \\[([^\\]]+)\\] failed to connect via \\[([^\\]]+)\\] due to \\[([^\\]]+)\\].*$",
          replace: "$3", outputIfNoMatch: false }
      ]
    },

    // ---- 4. Interactive login failure -> Authentication (3002) -----------
    // "Connection: User [admin] from [192.0.2.20] failed to log in
    //  via [SSH] due to authorization failure."
    {
      id: "dsmLoginFail",
      halt: true,
      attributes: {
        class_uid:     3002,
        class_name:    "Authentication",
        category_uid:  3,
        category_name: "Identity & Access Management",
        activity_id:   1,
        activity_name: "Logon",
        type_uid:      300201,
        status:        "Failure",
        status_id:     2,
        is_remote:     true,
        severity_id:   3
      },
      format: ".* failed to log in via \\[",
      rewrites: [
        { input: "message", output: "actor.user.name",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^\\]]+)\\] failed to log in via \\[([^\\]]+)\\] due to ([^\\r\\n]+)$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "src_endpoint.ip",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^\\]]+)\\] failed to log in via \\[([^\\]]+)\\] due to ([^\\r\\n]+)$",
          replace: "$2", outputIfNoMatch: false },
        { input: "message", output: "unmapped.login_service",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^\\]]+)\\] failed to log in via \\[([^\\]]+)\\] due to ([^\\r\\n]+)$",
          replace: "$3", outputIfNoMatch: false },
        { input: "message", output: "status_detail",
          match: "^.*Connection: User \\[([^\\]]+)\\] from \\[([^\\]]+)\\] failed to log in via \\[([^\\]]+)\\] due to ([^\\r\\n]+)$",
          replace: "$4", outputIfNoMatch: false },
        // Trailing-full-stop override: matches only when the reason ends
        // in '.', and re-writes status_detail without it.
        { input: "message", output: "status_detail",
          match: "^.* due to ([^\\r\\n]*[^.\\r\\n])\\.$",
          replace: "$1", outputIfNoMatch: false },
        // DOMAIN\user override (see dsmShareAccess for the rationale).
        { input: "message", output: "actor.user.domain",
          match: "^.*Connection: User \\[([^\\\\]+)\\\\([^\\]]+)\\].*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "actor.user.name",
          match: "^.*Connection: User \\[([^\\\\]+)\\\\([^\\]]+)\\].*$",
          replace: "$2", outputIfNoMatch: false }
      ]
    },

    // ---- 5. SMB file operation -> File System Activity (1001) ------------
    // "WinFileService Event: delete, Path: /a/b.zip, File/Folder: File,
    //  Size: 127.82 KB, User: svcbackup, IP: 192.0.2.10"
    //
    // The rename variant puts both paths in one field:
    //  "Path: /old/TMPNAME.3TS -> /new/archive.zip"
    {
      id: "dsmFileOp",
      halt: true,
      skipNumericConversion: true,
      attributes: {
        class_uid:     1001,
        class_name:    "File System Activity",
        category_uid:  1,
        category_name: "System Activity",
        status:        "Success",
        status_id:     1,
        severity_id:   1
      },
      format: ".*WinFileService Event: ",
      rewrites: [
        // Shared skeleton. Groups:
        //   1 verb  2 path (both halves on renames)  3 File|Folder
        //   4 size text  5 user  6 client ip
        { input: "message", output: "unmapped.vendor_action",
          match: "^.*WinFileService Event: ([a-z]+), Path: (.+), File/Folder: ([^,]+), Size: ([^,]+), User: ([^,]+), IP: ([0-9.]+)$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "file.path",
          match: "^.*WinFileService Event: ([a-z]+), Path: (.+), File/Folder: ([^,]+), Size: ([^,]+), User: ([^,]+), IP: ([0-9.]+)$",
          replace: "$2", outputIfNoMatch: false },
        { input: "message", output: "unmapped.fs_object",
          match: "^.*WinFileService Event: ([a-z]+), Path: (.+), File/Folder: ([^,]+), Size: ([^,]+), User: ([^,]+), IP: ([0-9.]+)$",
          replace: "$3", outputIfNoMatch: false },
        { input: "message", output: "unmapped.size_text",
          match: "^.*WinFileService Event: ([a-z]+), Path: (.+), File/Folder: ([^,]+), Size: ([^,]+), User: ([^,]+), IP: ([0-9.]+)$",
          replace: "$4", outputIfNoMatch: false },
        { input: "message", output: "actor.user.name",
          match: "^.*WinFileService Event: ([a-z]+), Path: (.+), File/Folder: ([^,]+), Size: ([^,]+), User: ([^,]+), IP: ([0-9.]+)$",
          replace: "$5", outputIfNoMatch: false },
        { input: "message", output: "unmapped.client_ip",
          match: "^.*WinFileService Event: ([a-z]+), Path: (.+), File/Folder: ([^,]+), Size: ([^,]+), User: ([^,]+), IP: ([0-9.]+)$",
          replace: "$6", outputIfNoMatch: false },

        // Rename overrides: these two match ONLY when the path field
        // contains the " -> " arrow, re-writing file.path to the source
        // path and adding the destination.
        { input: "message", output: "file.path",
          match: "^.*, Path: (.+) -> .+, File/Folder: .*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "file_result.path",
          match: "^.*, Path: .+ -> (.+), File/Folder: .*$",
          replace: "$1", outputIfNoMatch: false },

        // Size value/unit split. Both no-op on folders ("Size: NA"), so
        // the raw string in unmapped.size_text is the only value there.
        { input: "message", output: "unmapped.size_value",
          match: "^.*, Size: ([0-9.]+) [KMGT]?B, .*$",
          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.size_unit",
          match: "^.*, Size: [0-9.]+ ([KMGT]?B), .*$",
          replace: "$1", outputIfNoMatch: false }
      ]
    },

    // ---- 6. DSM subsystem notice -> no OCSF class ------------------------
    // "System SYSTEM:<TAB>Failed to send email. (Error: ...)"
    // "NetworkBackup SYSTEM:<TAB>Shared Folder Sync failed to sync ..."
    // Appliance housekeeping (mail relay, share sync, share creation).
    // No OCSF class covers appliance service state, so these keep vendor
    // fields only - consistent with the storage-array decision in the
    // Dell/HPE parser. A bare space in a format matches \s+, which is how
    // the literal TAB after "SYSTEM:" is consumed.
    {
      id: "dsmSubsystem",
      halt: true,
      format: ".* SYSTEM: ",
      rewrites: [
        { input:   "message",
          output:  "unmapped.dsm_subsystem",
          match:   "^.*\\d{2}:\\d{2}:\\d{2} [^ ]+ ([^ ]+) SYSTEM:.*$",
          replace: "$1", outputIfNoMatch: false },
        { input:   "message",
          output:  "unmapped.event_message",
          match:   "^.*SYSTEM:\\s*([^\\r\\n]+)$",
          replace: "$1", outputIfNoMatch: false }
      ]
    }
  ],

  mappings: {
    version: 1,
    mappings: [
      {
        // ---- file ops: type + activity enums ----------------------------
        predicate: "dsmFileOp == 'true'",
        transformations: [
          // DSM says "File" / "Folder"; OCSF file.type_id is
          // 1 = Regular File, 2 = Folder.
          { constant: { field: "file.type",    value: "Regular File",
                        predicate: "unmapped.fs_object == 'File'" } },
          { constant: { field: "file.type_id", value: 1,
                        predicate: "unmapped.fs_object == 'File'" } },
          { constant: { field: "file.type",    value: "Folder",
                        predicate: "unmapped.fs_object == 'Folder'" } },
          { constant: { field: "file.type_id", value: 2,
                        predicate: "unmapped.fs_object == 'Folder'" } },

          // Vendor verb -> OCSF activity enum. Delete and Rename are the
          // two seen in the sample; the rest are included because DSM
          // emits them from the same WinFileService logger and they are
          // exact enum matches.
          { constant: { field: "activity_id",   value: 4,
                        predicate: "unmapped.vendor_action == 'delete'" } },
          { constant: { field: "activity_name", value: "Delete",
                        predicate: "unmapped.vendor_action == 'delete'" } },
          { constant: { field: "type_uid",      value: 100104,
                        predicate: "unmapped.vendor_action == 'delete'" } },

          { constant: { field: "activity_id",   value: 5,
                        predicate: "unmapped.vendor_action == 'rename'" } },
          { constant: { field: "activity_name", value: "Rename",
                        predicate: "unmapped.vendor_action == 'rename'" } },
          { constant: { field: "type_uid",      value: 100105,
                        predicate: "unmapped.vendor_action == 'rename'" } },

          { constant: { field: "activity_id",   value: 1,
                        predicate: "unmapped.vendor_action == 'create'" } },
          { constant: { field: "activity_name", value: "Create",
                        predicate: "unmapped.vendor_action == 'create'" } },
          { constant: { field: "type_uid",      value: 100101,
                        predicate: "unmapped.vendor_action == 'create'" } },

          { constant: { field: "activity_id",   value: 2,
                        predicate: "unmapped.vendor_action == 'read'" } },
          { constant: { field: "activity_name", value: "Read",
                        predicate: "unmapped.vendor_action == 'read'" } },
          { constant: { field: "type_uid",      value: 100102,
                        predicate: "unmapped.vendor_action == 'read'" } },

          { constant: { field: "activity_id",   value: 3,
                        predicate: "unmapped.vendor_action == 'write'" } },
          { constant: { field: "activity_name", value: "Update",
                        predicate: "unmapped.vendor_action == 'write'" } },
          { constant: { field: "type_uid",      value: 100103,
                        predicate: "unmapped.vendor_action == 'write'" } },

          { drop: { field: "dsmFrame" } },
          { drop: { field: "dsmFileOp" } }
        ]
      },
      {
        // ---- SMB share access: the NAS is the access target ------------
        predicate: "dsmShareAccess == 'true'",
        transformations: [
          { copy: { from: "device.hostname", to: "dst_endpoint.hostname" } },
          { constant: { field: "unmapped.vendor_action", value: "tree_connect" } },
          { drop: { field: "dsmFrame" } },
          { drop: { field: "dsmShareAccess" } }
        ]
      },
      {
        predicate: "dsmShareReject == 'true'",
        transformations: [
          { copy: { from: "device.hostname", to: "dst_endpoint.hostname" } },
          { constant: { field: "unmapped.vendor_action", value: "negotiate_reject" } },
          { drop: { field: "dsmFrame" } },
          { drop: { field: "dsmShareReject" } }
        ]
      },
      {
        // ---- interactive login failure ---------------------------------
        predicate: "dsmLoginFail == 'true'",
        transformations: [
          { copy: { from: "device.hostname", to: "dst_endpoint.hostname" } },
          // SSH is not in the OCSF auth_protocol_id enum -> 99 (Other).
          { constant: { field: "auth_protocol_id", value: 99 } },
          { copy: { from: "unmapped.login_service", to: "auth_protocol" } },
          { drop: { field: "dsmFrame" } },
          { drop: { field: "dsmLoginFail" } }
        ]
      },
      {
        predicate: "dsmSubsystem == 'true'",
        transformations: [
          { drop: { field: "dsmFrame" } },
          { drop: { field: "dsmSubsystem" } }
        ]
      }
    ]
  },

  // Keep the raw line: DSM prose carries detail the bracketed fields do
  // not (error codes, task names, free-text reasons), and the message
  // catalog is far larger than the five shapes sampled here.
  discardAttributes: []
}
