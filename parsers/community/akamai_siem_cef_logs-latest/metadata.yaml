metadata_details:
  purpose: "Parser for Akamai SIEM connector events in CEF format, normalised to OCSF HTTP Activity (4002)."
  datasource_vendor: "Akamai"
  dataSource: "Akamai SIEM"
  format: "cef"
  ingestion_method: syslog
  dependency_summary: "Requires the Akamai SIEM connector configured for CEF output, one record per line."
  performance_impact: "Minimal - one fragment match plus independent per-field rewrites."
  tags: "akamai, siem, cef, waf, http, security, ocsf, parser"
  version: "1.0.10"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
