metadata_details:
  purpose: "Parser for IBM i (AS/400) syslog, normalising web access records to OCSF HTTP Activity (4002) and user-profile audit records to Account Change (3001)."
  datasource_vendor: "IBM"
  dataSource: "IBM AS400"
  format: "syslog"
  ingestion_method: syslog
  dependency_summary: "Requires an IBM i syslog forwarder delivering single-line BSD syslog."
  performance_impact: "Minimal - one frame match plus one fragment match per record type."
  tags: "ibm, as400, ibm-i, audit-journal, syslog, ocsf, parser"
  version: "1.0.0"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
