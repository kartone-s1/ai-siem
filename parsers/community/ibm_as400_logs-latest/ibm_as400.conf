// =====================================================================
// IBM i (AS/400) - syslog feed carrying two record types
// =====================================================================
//
// Wire shape (one line each; BSD syslog frame, no hostname field - the
// word after the timestamp is the syslog TAG, "srvaudit" in the sample):
//
//   <PRI>MMM DD HH:MM:SS <tag>: <body>
//
// Two bodies exist in the sample:
//
//   1. Web-server access record  ->  OCSF HTTP Activity (4002)
//        <ip> |<client chain>| <ident> <user> [DD/Mon/YYYY:HH:MM:SS +ZZZZ]
//        <number> |<METHOD> <path>?<query> HTTP/x.y| <status> ...
//
//   2. IBM i audit-journal record for a user profile  ->  OCSF Account
//      Change (3001)
//        YYYY-MM-DD-HH.MM.SS.uuuuuu System: <system>  <Create|Change|Delete>
//        USRPRF(<profile>) <attribute list>
//        Change records carry "old X(..) new X(..)" pairs.
//
// ---------------------------------------------------------------------
// Design (mirrors the tenant-proven NetApp ONTAP parser):
//
//  * ONE non-halting frame captures the syslog header.
//  * ONE capture-free fragment per record type sets the OCSF class and
//    halts. Fragments carry NO field matchers on purpose - fragments with
//    captures silently match nothing on the tenant.
//  * Every body field comes from a `rewrites:` rule reading `message`.
//    Every rule sets outputIfNoMatch:false (the default would copy the
//    WHOLE raw line into the output field on a miss) and ends in `$`
//    (a rule without an end anchor leaves trailing text on the value).
//  * Neither record's header time is usable as-is, so each is rebuilt as
//    ISO 8601 into `timestamp`; the raw text is kept in
//    metadata.original_time.
//  * The web lines are TRUNCATED by the syslog source, mid-URL, in all but
//    one sample line. Nothing here may require the HTTP version, status
//    code or any other trailing token to be present.
//
// ---------------------------------------------------------------------
// KNOWN GAPS - not verifiable from the sample, see the handoff:
//  * The number after the access-log timestamp is unidentified (bytes or
//    duration); it lands in unmapped.unlabeled_metric, not in an OCSF field.
//  * The leading IP is unidentified (reverse proxy or the server itself);
//    it lands in unmapped.leading_ip. src_endpoint.ip is the first
//    address of the pipe-delimited client chain.
//  * No complete access line exists, so no HTTP status code is parsed.
//  * AS/400 audit time has no offset; `timezone` below is an assumption.
// =====================================================================

{
  // Applies ONLY to the AS/400 audit time (no offset in the source).
  // The web time carries its own +ZZZZ offset and ignores this.
  // ASSUMPTION - confirm against the IBM i system time zone.
  timezone: "Europe/Rome",

  attributes: {
    // ---- 4 mandatory ----
    "dataSource.category": "security",
    "dataSource.name":     "IBM AS400",
    "dataSource.vendor":   "IBM",
    "metadata.version":    "1.0.0",

    "metadata.product.vendor_name": "IBM",
    "metadata.product.name":        "IBM i",
    "metadata.log_provider":        "syslog"
  },

  patterns: {
    // BSD syslog header time: "Oct 15 10:09:26" (day may be space-padded).
    bsdTs:  "\\w{3}\\s+\\d{1,2} \\d{2}:\\d{2}:\\d{2}",
    // Syslog TAG: everything up to the colon.
    tagTok: "[^\\s:]+"
  },

  formats: [

    // ---- 1. Syslog frame (sentinel only, no halt) -----------------------
    // Anchored, three captures, no optional parts.
    {
      id: "ibmiFrame",
      skipNumericConversion: true,
      format: "<$unmapped.syslog_pri=digits$>$unmapped.syslog_time=bsdTs$ $unmapped.syslog_tag=tagTok$: "
    },

    // ---- 2. Web access record -> HTTP Activity (4002) -------------------
    // Capture-free fragment. "] <digits> |<METHOD> " appears only in the
    // access record: the bracketed time, then the unlabeled number, then
    // the pipe-quoted request line.
    //
    // Rewrite groups, shared prefix WP = through the "|" before the method:
    //   ^[^\[]*\[[^\]]*\]\s+[0-9]+\s+\|
    {
      id: "ibmiWebAccess",
      halt: true,
      skipNumericConversion: true,
      attributes: {
        class_uid:     4002,
        class_name:    "HTTP Activity",
        category_uid:  4,
        category_name: "Network Activity",
        severity_id:   1
      },
      format: ".*\\] [0-9]+ \\|[A-Z]+ ",
      rewrites: [
        // ---- Endpoints ----
        // First token of the line body: the leading, unidentified IP.
        { input: "message", output: "unmapped.leading_ip", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+([^\\s|]+)\\s*\\|.*$", replace: "$1", outputIfNoMatch: false },
        // Whole pipe-delimited chain, e.g. "a, b, c".
        { input: "message", output: "unmapped.client_ip_chain", match: "^[^|]*\\|\\s*([^|]*[^|\\s])\\s*\\|.*$", replace: "$1", outputIfNoMatch: false },
        // Client = first address of that chain. Requires an address-shaped
        // token so a placeholder like "-" yields no field at all.
        { input: "message", output: "src_endpoint.ip", match: "^[^|]*\\|\\s*([0-9a-fA-F.:]+)\\s*[,|].*$", replace: "$1", outputIfNoMatch: false },
        // Fourth token after the chain = authenticated user. "-" (the
        // only value in the sample) cannot match [^\s-]\S*, so no field.
        { input: "message", output: "actor.user.name", match: "^[^|]*\\|[^|]*\\|\\s+\\S+\\s+([^\\s-]\\S*)\\s+\\[.*$", replace: "$1", outputIfNoMatch: false },

        // ---- Time ----
        { input: "message", output: "metadata.original_time", match: "^[^\\[]*\\[([^\\]]+)\\].*$", replace: "$1", outputIfNoMatch: false },
        // "15/Oct/2026:08:53:20 +0200" -> "2026-10-15T08:53:20+02:00".
        // One rule per month name; exactly one fires, eleven are no-ops.
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Jan/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-01-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Feb/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-02-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Mar/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-03-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Apr/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-04-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/May/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-05-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Jun/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-06-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Jul/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-07-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Aug/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-08-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Sep/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-09-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Oct/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-10-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Nov/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-11-$1T$3$4$5:$6", outputIfNoMatch: false },
        { input: "message", output: "timestamp", match: "^[^\\[]*\\[([0-9]{2})/Dec/([0-9]{4}):([0-9]{2}:[0-9]{2}:[0-9]{2})\\s+([+-])([0-9]{2})([0-9]{2})\\].*$", replace: "$2-12-$1T$3$4$5:$6", outputIfNoMatch: false },

        // ---- Unidentified number after the time (bytes or duration) ----
        { input: "message", output: "unmapped.unlabeled_metric", match: "^[^\\[]*\\[[^\\]]*\\]\\s+([0-9]+)\\s+\\|.*$", replace: "$1", outputIfNoMatch: false },

        // ---- Request line ----
        { input: "message", output: "http_request.http_method", match: "^[^\\[]*\\[[^\\]]*\\]\\s+[0-9]+\\s+\\|([A-Z]+)\\s.*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "http_request.url.path", match: "^[^\\[]*\\[[^\\]]*\\]\\s+[0-9]+\\s+\\|[A-Z]+\\s+([^?\\s]*).*$", replace: "$1", outputIfNoMatch: false },
        // Raw, still percent-encoded. On truncated lines this is whatever
        // survived the cut; no field when there is no "?".
        { input: "message", output: "http_request.url.query_string", match: "^[^\\[]*\\[[^\\]]*\\]\\s+[0-9]+\\s+\\|[A-Z]+\\s+[^?\\s]*\\?(\\S*).*$", replace: "$1", outputIfNoMatch: false },
        // Requires the closing "|" so a line cut at "HTTP/1." cannot
        // yield a half version.
        { input: "message", output: "http_request.version", match: "^[^\\[]*\\[[^\\]]*\\]\\s+[0-9]+\\s+\\|[A-Z]+\\s+\\S+\\s+HTTP/([0-9.]+)\\|.*$", replace: "$1", outputIfNoMatch: false }
      ]
    },

    // ---- 3. User-profile audit -> Account Change (3001) -----------------
    // Capture-free fragment. "System: <name> <Verb> USRPRF(" is specific to
    // the user-profile audit record. Other IBM i object types (JOBD, SYSVAL,
    // ...) are NOT matched and fall through with the frame only.
    //
    // Rewrite prefix A = syslog header + audit time + "System: ":
    //   ^<[0-9]+>[A-Za-z]+\s+[0-9]+\s+[0-9:]+\s+[^\s:]+:\s+
    //     [0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\s+System:\s+
    {
      id: "ibmiUserProfileAudit",
      halt: true,
      skipNumericConversion: true,
      attributes: {
        class_uid:     3001,
        class_name:    "Account Change",
        category_uid:  3,
        category_name: "Identity & Access Management",
        severity_id:   1,
        // A journal entry exists only because the change happened.
        status_id:     1,
        status:        "Success"
      },
      format: ".* System: \\S+\\s+\\w+ USRPRF\\(",
      rewrites: [
        // ---- Time ----
        { input: "message", output: "metadata.original_time", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+)\\s+System:.*$", replace: "$1", outputIfNoMatch: false },
        // "2026-10-15-09.25.59.170595" -> "2026-10-15T09:25:59.170". The
        // microseconds are cut to milliseconds: only second-resolution ISO
        // is tenant-verified, so this is the conservative form. Widen to
        // all six digits once Test Parser accepts it. Raw value is kept in
        // metadata.original_time.
        { input: "message", output: "timestamp", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+([0-9]{4})-([0-9]{2})-([0-9]{2})-([0-9]{2})\\.([0-9]{2})\\.([0-9]{2})\\.([0-9]{3})[0-9]*\\s+System:.*$", replace: "$1-$2-$3T$4:$5:$6.$7", outputIfNoMatch: false },

        // ---- System, verb, target profile ----
        { input: "message", output: "device.hostname", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+(\\S+)\\s+[A-Za-z]+\\s+USRPRF\\(.*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.audit_action", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+([A-Za-z]+)\\s+USRPRF\\(.*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "user.name", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+[A-Za-z]+\\s+USRPRF\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },
        // Everything after USRPRF(x): the full attribute list, so nothing
        // that is not individually extracted below is lost.
        { input: "message", output: "unmapped.profile_attributes", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+[A-Za-z]+\\s+USRPRF\\([^)]*\\)\\s*(.+)$", replace: "$1", outputIfNoMatch: false },

        // ---- Activity kind ----
        // Written in ORDER, later rule wins, so a Change that also touches
        // STATUS reports Enable/Disable rather than Password Change.
        // Resolved to activity_id / name / type_uid in `mappings`.
        { input: "message", output: "unmapped.activity_kind", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+Create\\s+USRPRF\\(.*$", replace: "create", outputIfNoMatch: false },
        { input: "message", output: "unmapped.activity_kind", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+Delete\\s+USRPRF\\(.*$", replace: "delete", outputIfNoMatch: false },
        { input: "message", output: "unmapped.activity_kind", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+Change\\s+USRPRF\\(.*$", replace: "change", outputIfNoMatch: false },
        { input: "message", output: "unmapped.activity_kind", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+Change\\s+USRPRF\\(.*\\snew\\s+PWDCHGDAT\\(.*$", replace: "password_change", outputIfNoMatch: false },
        { input: "message", output: "unmapped.activity_kind", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+Change\\s+USRPRF\\(.*\\snew\\s+STATUS\\(\\*ENABLED\\).*$", replace: "enable", outputIfNoMatch: false },
        { input: "message", output: "unmapped.activity_kind", match: "^<[0-9]+>[A-Za-z]+\\s+[0-9]+\\s+[0-9:]+\\s+[^\\s:]+:\\s+[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9.]+\\s+System:\\s+\\S+\\s+Change\\s+USRPRF\\(.*\\snew\\s+STATUS\\(\\*DISABLED\\).*$", replace: "disable", outputIfNoMatch: false },

        // ---- Change records: old/new pairs ----
        { input: "message", output: "unmapped.old_status", match: "^.*\\sold\\s+STATUS\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.new_status", match: "^.*\\snew\\s+STATUS\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.old_pwdchgdat", match: "^.*\\sold\\s+PWDCHGDAT\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.new_pwdchgdat", match: "^.*\\snew\\s+PWDCHGDAT\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },

        // ---- Create / Delete records only ----
        // Gated on the verb: on a Change record these keywords would be
        // old/new values, and the greedy match would return the NEW one.
        { input: "message", output: "unmapped.user_class", match: "^.*\\sSystem:\\s+\\S+\\s+Create\\s+USRPRF\\(.*\\sUSRCLS\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.special_authorities", match: "^.*\\sSystem:\\s+\\S+\\s+Create\\s+USRPRF\\(.*\\sSPCAUT\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.profile_text", match: "^.*\\sSystem:\\s+\\S+\\s+(?:Create|Delete)\\s+USRPRF\\(.*\\sTEXT\\(([^)]*)\\).*$", replace: "$1", outputIfNoMatch: false }
      ]
    }
  ],

  mappings: {
    version: 1,
    mappings: [
      {
        // ---- Web access -> HTTP Activity (4002) -------------------------
        predicate: "ibmiWebAccess == 'true'",
        transformations: [
          // Default first; a later constant for the same field wins
          // (same idiom as status Success/Failure in the NetApp parser).
          // TRACE and CONNECT stay Other.
          { constant: { field: "activity_id",   value: 99 } },
          { constant: { field: "activity_name", value: "Other" } },
          { constant: { field: "type_uid",      value: 400299 } },

          { constant: { field: "activity_id",   value: 3,        predicate: "http_request.http_method == 'GET'" } },
          { constant: { field: "activity_name", value: "Get",    predicate: "http_request.http_method == 'GET'" } },
          { constant: { field: "type_uid",      value: 400203,   predicate: "http_request.http_method == 'GET'" } },

          { constant: { field: "activity_id",   value: 6,        predicate: "http_request.http_method == 'POST'" } },
          { constant: { field: "activity_name", value: "Post",   predicate: "http_request.http_method == 'POST'" } },
          { constant: { field: "type_uid",      value: 400206,   predicate: "http_request.http_method == 'POST'" } },

          { constant: { field: "activity_id",   value: 7,        predicate: "http_request.http_method == 'PUT'" } },
          { constant: { field: "activity_name", value: "Put",    predicate: "http_request.http_method == 'PUT'" } },
          { constant: { field: "type_uid",      value: 400207,   predicate: "http_request.http_method == 'PUT'" } },

          { constant: { field: "activity_id",   value: 2,        predicate: "http_request.http_method == 'DELETE'" } },
          { constant: { field: "activity_name", value: "Delete", predicate: "http_request.http_method == 'DELETE'" } },
          { constant: { field: "type_uid",      value: 400202,   predicate: "http_request.http_method == 'DELETE'" } },

          { constant: { field: "activity_id",   value: 4,        predicate: "http_request.http_method == 'HEAD'" } },
          { constant: { field: "activity_name", value: "Head",   predicate: "http_request.http_method == 'HEAD'" } },
          { constant: { field: "type_uid",      value: 400204,   predicate: "http_request.http_method == 'HEAD'" } },

          { constant: { field: "activity_id",   value: 5,         predicate: "http_request.http_method == 'OPTIONS'" } },
          { constant: { field: "activity_name", value: "Options", predicate: "http_request.http_method == 'OPTIONS'" } },
          { constant: { field: "type_uid",      value: 400205,    predicate: "http_request.http_method == 'OPTIONS'" } },

          { constant: { field: "activity_id",   value: 9,       predicate: "http_request.http_method == 'PATCH'" } },
          { constant: { field: "activity_name", value: "Patch", predicate: "http_request.http_method == 'PATCH'" } },
          { constant: { field: "type_uid",      value: 400209,  predicate: "http_request.http_method == 'PATCH'" } },

          // Drop the format-id sentinels so they do not ship on the event.
          { drop: { field: "ibmiFrame" } },
          { drop: { field: "ibmiWebAccess" } }
        ]
      },
      {
        // ---- User-profile audit -> Account Change (3001) ----------------
        predicate: "ibmiUserProfileAudit == 'true'",
        transformations: [
          { constant: { field: "activity_id",   value: 1,                 predicate: "unmapped.activity_kind == 'create'" } },
          { constant: { field: "activity_name", value: "Create",           predicate: "unmapped.activity_kind == 'create'" } },
          { constant: { field: "type_uid",      value: 300101,            predicate: "unmapped.activity_kind == 'create'" } },

          { constant: { field: "activity_id",   value: 2,                 predicate: "unmapped.activity_kind == 'enable'" } },
          { constant: { field: "activity_name", value: "Enable",           predicate: "unmapped.activity_kind == 'enable'" } },
          { constant: { field: "type_uid",      value: 300102,            predicate: "unmapped.activity_kind == 'enable'" } },

          { constant: { field: "activity_id",   value: 3,                 predicate: "unmapped.activity_kind == 'password_change'" } },
          { constant: { field: "activity_name", value: "Password Change",  predicate: "unmapped.activity_kind == 'password_change'" } },
          { constant: { field: "type_uid",      value: 300103,            predicate: "unmapped.activity_kind == 'password_change'" } },

          { constant: { field: "activity_id",   value: 5,                 predicate: "unmapped.activity_kind == 'disable'" } },
          { constant: { field: "activity_name", value: "Disable",          predicate: "unmapped.activity_kind == 'disable'" } },
          { constant: { field: "type_uid",      value: 300105,            predicate: "unmapped.activity_kind == 'disable'" } },

          { constant: { field: "activity_id",   value: 8,                 predicate: "unmapped.activity_kind == 'delete'" } },
          { constant: { field: "activity_name", value: "Delete",           predicate: "unmapped.activity_kind == 'delete'" } },
          { constant: { field: "type_uid",      value: 300108,            predicate: "unmapped.activity_kind == 'delete'" } },

          // Any other attribute change (PWDEXP, NOTVLDSIGN alone, ...).
          { constant: { field: "activity_id",   value: 99,                predicate: "unmapped.activity_kind == 'change'" } },
          { constant: { field: "activity_name", value: "Other",            predicate: "unmapped.activity_kind == 'change'" } },
          { constant: { field: "type_uid",      value: 300199,            predicate: "unmapped.activity_kind == 'change'" } },

          { drop: { field: "unmapped.activity_kind" } },
          { drop: { field: "ibmiFrame" } },
          { drop: { field: "ibmiUserProfileAudit" } }
        ]
      }
    ]
  }

  // `message` is deliberately NOT discarded. The sample's header says
  // "AS400 SYSLOG", and the audit journal has many entry types beyond
  // USRPRF; any shape not matched above would otherwise be left as an
  // empty event with no raw text to recover it from.
}
