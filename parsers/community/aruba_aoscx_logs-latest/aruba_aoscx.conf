    // =================================================================================

    // DHCPv4 snooping: packet dropped, source port == destination port
    {
      id: "aoscx_dhcp_snooping_drop",
      format: "<$unmapped.syslog_priority=digits$>1 $timestamp=rfc5424Ts$ $device.hostname=hostName$ $unmapped.process_name=procName$ $unmapped.process_id=procId$ - - debug\\|$unmapped.log_level=logLvl$\\|$unmapped.module=modName$\\|$unmapped.module_instance=instName$\\|DHCPV4SNOOPING\\|DHCPV4SNOOPING\\|Packet dropped since source port and destination port are same\\. Port name: $src_endpoint.interface_name=portName$, vlanId: $src_endpoint.vlan_uid=digits$\\)",
