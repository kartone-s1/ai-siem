    {
      id: "aoscx_frame_generic",
      format: "<$unmapped.syslog_priority=digits$>1 $timestamp=rfc5424Ts$ $device.hostname=hostName$ $unmapped.process_name=procName$ $unmapped.process_id=procId$ - - $unmapped.event_message=restOfLine$",
