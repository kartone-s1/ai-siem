    {
      id: "aoscx_event_generic",
      format: "<$unmapped.syslog_priority=digits$>1 $timestamp=rfc5424Ts$ $device.hostname=hostName$ $unmapped.process_name=procName$ $unmapped.process_id=procId$ - - Event\\|$metadata.event_code=digits$\\|$unmapped.log_level=logLvl$\\|$unmapped.module=modName$\\|$unmapped.module_instance=instName$\\|$unmapped.event_message=restOfLine$",
