  mappings: {
    version: 1,
    mappings: [
      {
        predicate: "true",
        transformations: [

          // --- the switch reporting the event ---------------------------------------
          { copy: { from: "device.hostname", to: "device.name" } },

          // --- the authenticated account is also the actor of the event --------------
          { copy: { from: "user.name", to: "actor.user.name" } },

          // --- nginx IPv4-mapped IPv6 client -> plain IPv4 ---------------------------
          // No-op unless the nginx rewrite produced the scratch field.
          { copy: { from: "unmapped.tmp_v4mapped", to: "src_endpoint.ip" } },
          { drop:  { field: "unmapped.tmp_v4mapped" } },

          // --- AOS-CX / nginx log level -> OCSF severity_id --------------------------
          // Every format captures `unmapped.log_level` (the nginx format takes it from
          // "[crit]"), so this single cast covers the whole parser without an
          // enum_default clobbering a per-format value. OCSF 1.6.0 has `severity_id`
          // but no `severity_name`, and the bare `severity` field is reserved by ingest,
          // so only the numeric id is emitted.
          { copy: { from: "unmapped.log_level", to: "severity_id" } },
          { cast: { field: "severity_id", type: "enum",
                    enum: {
                      "LOG_DEBUG":  1, "debug":  1,
                      "LOG_INFO":   1, "info":   1,
                      "LOG_NOTICE": 1, "notice": 1,
                      "LOG_WARN":   3, "LOG_WARNING": 3, "warn": 3,
                      "LOG_ERR":    4, "LOG_ERROR":   4, "error": 4,
                      "LOG_CRIT":   5, "crit":   5,
                      "LOG_ALERT":  5, "alert":  5,
                      "LOG_EMERG":  6, "emerg":  6
                    },
                    enum_default: 0 } },

          // --- numeric coercions -----------------------------------------------------
          { cast: { field: "unmapped.syslog_priority",         type: "int" } },
          { cast: { field: "unmapped.process_id",              type: "int" } },
          { cast: { field: "http_response.code",               type: "int" } },
          { cast: { field: "dst_endpoint.port",                type: "int" } },
          { cast: { field: "unmapped.poe_device_type",         type: "int" } },
          { cast: { field: "unmapped.poe_device_class",        type: "int" } },
          { cast: { field: "unmapped.link_speed",              type: "int" } },
          { cast: { field: "unmapped.igmp_query_version",      type: "int" } },
          { cast: { field: "unmapped.igmp_configured_version", type: "int" } },
          { cast: { field: "unmapped.memory_usage_percent",    type: "int" } },
          { cast: { field: "unmapped.throttled_message_count", type: "int" } },
          { cast: { field: "unmapped.peer_pid",                type: "int" } },

          // --- intermediate capture buffers ------------------------------------------
          { drop: { field: "unmapped.rest_error_payload" } },
          { drop: { field: "unmapped.rest_uri_payload" } },
          { drop: { field: "unmapped.rest_uri" } },
          { drop: { field: "unmapped.nginx_detail" } },

          // --- format-id sentinels ----------------------------------------------------
          { drop: { field: "aoscx_auth_success" } },
          { drop: { field: "aoscx_auth_failure" } },
          { drop: { field: "aoscx_authz_allowed" } },
          { drop: { field: "aoscx_rest_logon" } },
          { drop: { field: "aoscx_rest_logon_failed" } },
          { drop: { field: "aoscx_rest_logoff" } },
          { drop: { field: "aoscx_ssh_logon" } },
          { drop: { field: "aoscx_ssh_logoff" } },
          { drop: { field: "aoscx_rest_http_error_nodetail" } },
          { drop: { field: "aoscx_rest_http_error" } },
          { drop: { field: "aoscx_rest_uri_parse_error" } },
          { drop: { field: "aoscx_nginx_error" } },
          { drop: { field: "aoscx_poe_detected" } },
          { drop: { field: "aoscx_poe_power_delivery" } },
          { drop: { field: "aoscx_poe_disconnected" } },
          { drop: { field: "aoscx_poe_invalid_signature" } },
          { drop: { field: "aoscx_link_up" } },
          { drop: { field: "aoscx_link_down" } },
          { drop: { field: "aoscx_stp_topology_change_received" } },
          { drop: { field: "aoscx_stp_topology_change_generated" } },
          { drop: { field: "aoscx_igmp_version_mismatch" } },
          { drop: { field: "aoscx_messages_throttled" } },
          { drop: { field: "aoscx_neighbor_mac_modified" } },
          { drop: { field: "aoscx_cdp_neighbor_updated" } },
          { drop: { field: "aoscx_lldp_neighbor_added" } },
          { drop: { field: "aoscx_memory_usage" } },
          { drop: { field: "aoscx_syslog_client_restarted" } },
          { drop: { field: "aoscx_syslog_service_starting" } },
          { drop: { field: "aoscx_syslog_service_started" } },
          { drop: { field: "aoscx_certificate_accepted" } },
          { drop: { field: "aoscx_certificate_ca_validated" } },
          { drop: { field: "aoscx_tpm_sign_success" } },
          { drop: { field: "aoscx_dhcp_snooping_drop" } },
          { drop: { field: "aoscx_mtrace_drop" } },
          { drop: { field: "aoscx_db_broken_pipe" } },
          { drop: { field: "aoscx_event_generic" } },
          { drop: { field: "aoscx_debug_structured_generic" } },
          { drop: { field: "aoscx_debug_generic" } },
          { drop: { field: "aoscx_frame_generic" } }
        ]
      }
    ]
  }
