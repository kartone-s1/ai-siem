metadata_details:
  purpose: "Parser for VMware vCenter Server Appliance syslog (RFC 5424), normalising session, SSH and sudo events to OCSF Authentication (3002) and access logs to HTTP Activity (4002)."
  datasource_vendor: "VMware"
  dataSource: "VMware vCenter"
  format: "syslog"
  ingestion_method: syslog
  dependency_summary: "Requires the appliance to forward its logs by syslog in RFC 5424 format."
  performance_impact: "Minimal - one anchored format per service."
  tags: "vmware, vcenter, vcsa, syslog, rfc5424, ocsf, parser"
  version: "1.0.0"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
