
{
  timezone: "UTC",

  attributes: {
    "metadata.version":    "1.0.10",
    "dataSource.category": "security",
    "dataSource.name":     "Akamai SIEM",
    "dataSource.vendor":   "Akamai",

    "metadata.product.vendor_name": "Akamai",
    "metadata.product.name":        "Akamai SIEM Connector (CEF)",
    "metadata.log_provider":        "Akamai SIEM Connector",

    "class_uid":     4002,
    "class_name":    "HTTP Activity",
    "category_uid":  4,
    "category_name": "Network Activity"
    // No type_uid: it is class_uid*100 + activity_id, and activity_id is
    // derived per-event from the HTTP method below.
  },

  patterns: {
    // A whole line made up only of whitespace, brackets, braces and commas:
    // "[", "  {", "  },", "  }", "]". The trailing `$` forces a full-line
    // match -- without it this would also match the leading indentation of a
    // `    "message": "..."` line, since formats match a prefix.
    // Braces live here rather than in an inline {regex=...} matcher, where
    // they would terminate the option early.
    scaffoldLine: "[\\s\\[\\]{},]+$"
  },

  formats: [
    {
      // The real event, FIRST and halting. Fragment anchored on CEF:, and it
      // deliberately captures only the CEF version -- everything else is
      // sliced from `message` by the rewrites, so there is no dependence on
      // how far a field matcher extends.
      id: "akamai-siem-cef",
      format: ".*CEF:$cef_version=digits$\\|",
      halt: true,

      rewrites: [
        // ---- CEF header (pipe-delimited fields 5 and 6) ------------------
        // detect|Activity detected|5  /  mitigate|Activity mitigated|10
        { input: "message", output: "unmapped.akamai.event_type", match: "^.*CEF:\\d+\\|[^|]*\\|[^|]*\\|[^|]*\\|([^|]*)\\|.*$",       replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "unmapped.akamai.event_name", match: "^.*CEF:\\d+\\|[^|]*\\|[^|]*\\|[^|]*\\|[^|]*\\|([^|]*)\\|.*$", replace: "$1", outputIfNoMatch: false },

        // ---- FREE-TEXT fields: bounded by their own always-present Label --
        // This is the parenthesis/space fix. Do NOT rewrite these to the
        // stop-at-space form used by the single-token fields below.
        { input: "message", output: "cs2", match: "^.*\\bcs2=(.*) cs2Label=.*$", replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "cs3", match: "^.*\\bcs3=(.*) cs3Label=.*$", replace: "$1", outputIfNoMatch: false },

        // ---- Single-token fields ------------------------------------------
        // `([^ \\"]+)` = stop at space, backslash or quote -- see TAIL SAFETY.
        // `+` not `*`: a truncated `Key=` at EOL must yield NO field, not "".
        { input: "message", output: "act",                      match: "^.*\\bact=([^ \\\\\"]+).*$",                      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "app",                      match: "^.*\\bapp=([^ \\\\\"]+).*$",                      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "cs1",                      match: "^.*\\bcs1=([^ \\\\\"]+).*$",                      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "devicePayloadId",          match: "^.*\\bdevicePayloadId=([^ \\\\\"]+).*$",           replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "dhost",                    match: "^.*\\bdhost=([^ \\\\\"]+).*$",                    replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "dpt",                      match: "^.*\\bdpt=([^ \\\\\"]+).*$",                      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "flexString1",              match: "^.*\\bflexString1=([^ \\\\\"]+).*$",               replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "flexString2",              match: "^.*\\bflexString2=([^ \\\\\"]+).*$",               replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "out",                      match: "^.*\\bout=([^ \\\\\"]+).*$",                      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "requestMethod",            match: "^.*\\brequestMethod=([^ \\\\\"]+).*$",             replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "src",                      match: "^.*\\bsrc=([^ \\\\\"]+).*$",                      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "start",                    match: "^.*\\bstart=([^ \\\\\"]+).*$",                    replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemRuleTags",       match: "^.*\\bAkamaiSiemRuleTags=([^ \\\\\"]+).*$",        replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemTLSVersion",     match: "^.*\\bAkamaiSiemTLSVersion=([^ \\\\\"]+).*$",      replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemResponseStatus", match: "^.*\\bAkamaiSiemResponseStatus=([^ \\\\\"]+).*$",  replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemContinent",      match: "^.*\\bAkamaiSiemContinent=([^ \\\\\"]+).*$",       replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemCountry",        match: "^.*\\bAkamaiSiemCountry=([^ \\\\\"]+).*$",         replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemCity",           match: "^.*\\bAkamaiSiemCity=([^ \\\\\"]+).*$",            replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemRegion",         match: "^.*\\bAkamaiSiemRegion=([^ \\\\\"]+).*$",          replace: "$1", outputIfNoMatch: false },
        { input: "message", output: "AkamaiSiemASN",            match: "^.*\\bAkamaiSiemASN=([^ \\\\\"]+).*$",             replace: "$1", outputIfNoMatch: false },

        // `request` legitimately contains CEF's `\=` escaping, so backslash
        // must NOT be excluded here. Verified never last on a line, so the
        // record terminator cannot leak in.
        { input: "message", output: "request",                  match: "^.*\\brequest=([^ \"]+).*$",                      replace: "$1", outputIfNoMatch: false },

        // ---- CEF `\=` unescape, in the REWRITE layer ----
        // CEF escapes "=" inside a value as `\=`. Two mapped fields carry it: the
        // request URL (up to 39 occurrences in a single value) and cs3 / Rule Data
        // (up to 2, e.g. `SCANTL\=9`). Counts measured over 20,000 events.
        //
        // `replaceAll: true` makes the substitution GLOBAL. WITHOUT it a rewrite
        // replaces only the FIRST match -- stated in the vendor reference
        // (references/scalyr-parsing-logs.md) and confirmed on-tenant at v1.0.7,
        // where the 4-escape mercure URL lost exactly one. v1.0.8 worked around
        // that with 40 chained in-place passes; this is the same result in one
        // rewrite per field.
        //
        // This also removes a real ceiling: the v1.0.8 chain cleared at most 40
        // occurrences and silently left residue beyond that, against an observed
        // maximum of 39. replaceAll is unbounded.
        //
        // Other rewrite-layer behaviour confirmed on-tenant and relied on here:
        //   - a rewrite can read a field an EARLIER rewrite created;
        //   - `outputIfNoMatch: true` passes a non-match through UNCHANGED;
        //   - `input == output` edits in place. Legal for PARTIAL matches only --
        //     a rewrite whose match covers the ENTIRE value is silently ignored,
        //     which is why cs3 is safe (the match is one escape, not the value).
        //
        // CONFIRMED ON-TENANT at v1.0.9: a 4-escape URL (the mercure record that
        // regressed at v1.0.7) came back with all four cleared from this ONE
        // rewrite, as did two 2-escape query strings and cs3's `SCANTL\=9`.
        // replaceAll takes no count parameter, so there is no structural ceiling
        // of the kind the v1.0.8 chain had. The 38/39-escape records in
        // samples/replaceall-test-records.log were not exercised in that run;
        // there is no mechanism by which a global substitution would clear 4 and
        // not 39, but if you want the belt-and-braces check, that file has them.
        { input: "request", output: "request_unescaped", match: "\\\\=", replace: "=", replaceAll: true, outputIfNoMatch: true },
        { input: "cs3",     output: "cs3",              match: "\\\\=", replace: "=", replaceAll: true, outputIfNoMatch: true }
      ]
    },

    {
      // UI-export scaffolding: "[", "  {", "  },", "  }", "]". Ordered AFTER
      // the halting event format, so it can never see a real record.
      id: "json-array-scaffold",
      format: "$scaffold=scaffoldLine$",
      discard: true,
      halt: true
    }
  ],

  mappings: {
    version: 1,
    mappings: [
      {
        predicate: "true",
        transformations: [
          // ---- Endpoints ----
          { rename: { from: "src",   to: "src_endpoint.ip" } },
          { rename: { from: "dhost", to: "dst_endpoint.hostname" } },
          { copy:   { from: ["dst_endpoint.hostname"], to: "http_request.url.hostname" } },
          { rename: { from: "dpt",   to: "dst_endpoint.port" } },
          { cast:   { field: "dst_endpoint.port", type: "int" } },

          // ---- HTTP ----
          { rename: { from: "requestMethod", to: "http_request.http_method" } },
          // request_unescaped is produced by a rewrite (see the rewrites block);
          // it is `request` with CEF's `\=` turned back into `=`. Both are
          // renamed: whichever exists wins, and request_unescaped is ordered
          // second so it takes precedence when present.
          { rename: { from: "request",           to: "http_request.url.url_string" } },
          { rename: { from: "request_unescaped", to: "http_request.url.url_string" } },
          { rename: { from: "app",           to: "http_request.version" } },
          { rename: { from: "AkamaiSiemResponseStatus", to: "http_response.code" } },
          { cast:   { field: "http_response.code", type: "int" } },
          { rename: { from: "out", to: "http_response.length" } },
          { cast:   { field: "http_response.length", type: "int" } },
          { rename: { from: "AkamaiSiemTLSVersion", to: "tls.version" } },

          // NOTE: there is deliberately NO mapper `replace` op here any more.
          // The `\=` unescape moved to the rewrites block. See the header.

          // ---- Client geo / ASN ----
          { rename: { from: "AkamaiSiemContinent", to: "src_endpoint.location.continent" } },
          { rename: { from: "AkamaiSiemCountry",   to: "src_endpoint.location.country" } },
          { rename: { from: "AkamaiSiemCity",      to: "src_endpoint.location.city" } },
          { rename: { from: "AkamaiSiemRegion",    to: "src_endpoint.location.region" } },
          { rename: { from: "AkamaiSiemASN",       to: "src_endpoint.autonomous_system.number" } },
          { cast:   { field: "src_endpoint.autonomous_system.number", type: "int" } },

          // ---- WAF rule / policy ----
          // cs1 = triggered rule IDs, cs2 = matching rule messages (the
          // free-text field this parser exists to get right),
          // flexString2 = Firewall Policy Id. `policy.group` is an OBJECT in
          // OCSF 4002, so the id goes on `policy.group.uid`.
          { rename: { from: "cs1",         to: "policy.uid" } },
          { rename: { from: "cs2",         to: "policy.name" } },
          { rename: { from: "flexString2", to: "policy.group.uid" } },
          { rename: { from: "cs3",         to: "unmapped.akamai.rule_data" } },
          // cs3 carries CEF-escaped `=` too, e.g. rule data `SCANTL\=9`. Left
          // as-is for now: once the rewrite-layer unescape is confirmed on the
          // URL, the same one-line rewrite applies to cs3. Not worth a second
          // unproven mechanism in the same upload.
          { rename: { from: "AkamaiSiemRuleTags", to: "unmapped.akamai.rule_tags" } },
          { rename: { from: "flexString1", to: "unmapped.akamai.security_config_id" } },
          { rename: { from: "cef_version", to: "unmapped.akamai.cef_version" } },

          // ---- Identity / time ----
          { rename: { from: "devicePayloadId", to: "metadata.uid" } },
          { copy:   { from: ["start"], to: "metadata.original_time" } },
          { rename: { from: "start", to: "time" } },
          { cast:   { field: "time", type: "int" } },

          // ---- Disposition -> OCSF action ----
          // Akamai act: deny = request blocked; alert = rule fired, request
          // still served; monitor = observed only. Raw value kept for fidelity.
          { copy: { from: ["act"], to: "unmapped.akamai.action" } },
          { constant: { field: "action_id", value: 99 } },
          { constant: { field: "action",    value: "Other" } },
          { constant: { field: "action_id", value: 2,        predicate: "act == 'deny'" } },
          { constant: { field: "action",    value: "Denied", predicate: "act == 'deny'" } },
          { constant: { field: "action_id", value: 1,         predicate: "act == 'alert'" } },
          { constant: { field: "action",    value: "Allowed", predicate: "act == 'alert'" } },
          { constant: { field: "action_id", value: 1,         predicate: "act == 'monitor'" } },
          { constant: { field: "action",    value: "Allowed", predicate: "act == 'monitor'" } },

          // ---- Severity ----
          // OCSF 4002 defines `severity` + `severity_id` and has NO
          // `severity_name`. `severity` is RESERVED by SDL ingest (coerced via
          // its syslog keyword table), so emit ONLY the integer severity_id.
          { constant: { field: "severity_id", value: 0 } },
          { constant: { field: "severity_id", value: 4, predicate: "act == 'deny'" } },
          { constant: { field: "severity_id", value: 3, predicate: "act == 'alert'" } },
          { constant: { field: "severity_id", value: 2, predicate: "act == 'monitor'" } },
          { drop: { field: "act" } },

          // ---- activity_id: for HTTP Activity 4002 this is the HTTP METHOD
          //      (1 Connect, 2 Delete, 3 Get, 4 Head, 5 Options, 6 Post,
          //      7 Put, 8 Trace, 9 Patch, 99 Other) -- NOT an allow/deny
          //      verb. Sample contains POST, GET, HEAD, PUT, PATCH, OPTIONS.
          { constant: { field: "activity_id",   value: 99 } },
          { constant: { field: "activity_name", value: "Other" } },
          { constant: { field: "activity_id",   value: 3,     predicate: "http_request.http_method == 'GET'" } },
          { constant: { field: "activity_name", value: "Get", predicate: "http_request.http_method == 'GET'" } },
          { constant: { field: "activity_id",   value: 6,      predicate: "http_request.http_method == 'POST'" } },
          { constant: { field: "activity_name", value: "Post", predicate: "http_request.http_method == 'POST'" } },
          { constant: { field: "activity_id",   value: 4,      predicate: "http_request.http_method == 'HEAD'" } },
          { constant: { field: "activity_name", value: "Head", predicate: "http_request.http_method == 'HEAD'" } },
          { constant: { field: "activity_id",   value: 7,     predicate: "http_request.http_method == 'PUT'" } },
          { constant: { field: "activity_name", value: "Put", predicate: "http_request.http_method == 'PUT'" } },
          { constant: { field: "activity_id",   value: 9,       predicate: "http_request.http_method == 'PATCH'" } },
          { constant: { field: "activity_name", value: "Patch", predicate: "http_request.http_method == 'PATCH'" } },
          { constant: { field: "activity_id",   value: 5,         predicate: "http_request.http_method == 'OPTIONS'" } },
          { constant: { field: "activity_name", value: "Options", predicate: "http_request.http_method == 'OPTIONS'" } },
          { constant: { field: "activity_id",   value: 2,        predicate: "http_request.http_method == 'DELETE'" } },
          { constant: { field: "activity_name", value: "Delete", predicate: "http_request.http_method == 'DELETE'" } },

          // ---- Cleanup ----
          { drop: { field: "akamai-siem-cef" } }
        ]
      }
    ]
  },

  discardAttributes: ["message"]
}
