// =====================================================================================
// Cisco ASA (Adaptive Security Appliance) syslog -> OCSF
//
// Input frame (as observed in the supplied sample -- no syslog timestamp, no hostname):
//     <PRI>%ASA-<severity>-<message-id>: <message body>
//
// Two additional frame variants are included for deployments that run with
// `logging timestamp` enabled or that relay through an RFC 3164 syslog collector.
// Frame formats do NOT halt, so the message-id-specific formats below still run and
// merge their captures into the same event.
//
// Message-id formats are ordered most-specific-first and all use `halt: true`.
// Cisco makes the identity-firewall user suffix `(DOMAIN\user)` / `(user)` and the
// TCP teardown reason optional, so each shape gets its own format rather than one
// long all-or-nothing format string.
//
// OCSF classes emitted:
//   4001 Network Activity    connection build/teardown (TCP/UDP/ICMP), SSL/TLS session
//   3002 Authentication      AAA / WebVPN authentication, AAA server state
//   4003 DNS Activity        user-identity DNS resolution failure
//   2004 Detection Finding   threat-detection drop-rate threshold breach
// =====================================================================================
{
  timezone: "UTC",

  attributes: {
    // --- 4 mandatory attributes ------------------------------------------------------
    "dataSource.category": "security",
    "dataSource.name":     "Cisco ASA",
    "dataSource.vendor":   "Cisco",
    "metadata.version":    "1.0.2",

    // --- OCSF product metadata -------------------------------------------------------
    "metadata.product.vendor_name": "Cisco",
    "metadata.product.name":        "Adaptive Security Appliance",
    "metadata.log_provider":        "Cisco ASA",

    // --- Default class, overridden per-format below. A message id this parser does
    //     not yet model still lands as Network Activity / Other rather than untyped.
    class_uid:     4001,
    class_name:    "Network Activity",
    category_uid:  4,
    category_name: "Network Activity",
    activity_id:   99,
    activity_name: "Other",
    type_uid:      400199,
    // Unknown until a message-id format overrides it, so that `status_id` is present
    // on every event and queries never have to special-case a missing field.
    status_id:     0,
    status:        "Unknown"
  },

  patterns: {
    // ASA syslog severity digit (0 emergency .. 7 debugging)
    asaSev:       "[0-7]",
    // ASA message id, e.g. 302013
    asaMsgId:     "\\d{3,7}",
    // IPv4, IPv6, or a redaction placeholder such as x.x.x.x. Excludes "/" so the
    // address/port split stays unambiguous.
    addr:         "[0-9a-fA-Fx:.]+",
    // Interface / security-zone name -- never contains a colon
    zoneName:     "[^:]+",
    word:         "[A-Za-z0-9_-]+",
    hostName:     "[^ ]+",
    // "TLS", "TLSv1.2", "DTLSv1.2"
    tlsVer:       "[A-Za-z0-9.]+",
    // ASA connection duration, h:mm:ss (hours are not zero padded)
    hms:          "\\d+:\\d{2}:\\d{2}",
    // value up to the closing ) / >
    inParen:      "[^)]+",
    inAngle:      "[^>]+",
    // identity-firewall domain component, terminated by the literal backslash
    notBackslash: "[^\\\\]+",
    // value terminated by " : " -- trailing whitespace excluded
    toColon:      "[^:]*[^:\\s]",
    // value terminated by " (" -- trailing whitespace excluded
    toParen:      "[^(]*[^(\\s]",
    // threat-detection object name inside "[ Scanning]"
    bracketWord:  "[^\\] ]+",
    // ASA-native timestamp: "Sep 16 2026 11:04:36"
    asaTs:        "\\w{3}\\s+\\d{1,2}\\s+\\d{4}\\s+\\d{1,2}:\\d{2}:\\d{2}",
    // RFC 3164 timestamp: "Sep 16 11:04:36"
    syslogTs:     "\\w{3}\\s+\\d{1,2}\\s+\\d{1,2}:\\d{2}:\\d{2}"
  },

  formats: [

    // =================================================================================
    // FRAME FORMATS -- capture syslog priority, ASA severity and message id.
    // No `halt`, so a message-id format below still applies to the same line.
    // =================================================================================

    // Sample shape: no timestamp, no hostname.
    //   <PRI>%ASA-6-302014: ...
    {
      id: "asa_frame_bare",
      format: "<$unmapped.syslog_priority=digits$>%ASA-$unmapped.asa_severity=asaSev$-$metadata.event_code=asaMsgId$:"
    },

    // `logging timestamp` enabled on the appliance.
    //   <PRI>Sep 16 2026 11:04:36: %ASA-6-302014: ...
    {
      id: "asa_frame_device_ts",
      format: "<$unmapped.syslog_priority=digits$>$timestamp=asaTs$: %ASA-$unmapped.asa_severity=asaSev$-$metadata.event_code=asaMsgId$:"
    },

    // Relayed through an RFC 3164 collector that stamps time + host.
    //   <PRI>Sep 16 11:04:36 asa-fw-01 %ASA-6-302014: ...
    {
      id: "asa_frame_rfc3164",
      format: "<$unmapped.syslog_priority=digits$>$timestamp=syslogTs$ $device.hostname=hostName$ %ASA-$unmapped.asa_severity=asaSev$-$metadata.event_code=asaMsgId$:"
    },

    // =================================================================================
    // 302013 / 302015 -- Built inbound|outbound TCP|UDP connection
    // =================================================================================

    // With the identity-firewall user suffix.
    {
      id: "asa_built_conn_user",
      format: ".*%ASA-[0-7]-30201[35]: Built $unmapped.conn_direction=word$ $connection_info.protocol_name=word$ connection $connection_info.uid=digits$ for $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ \\($unmapped.nat_src_ip=addr$/$unmapped.nat_src_port=digits$\\)\\($actor.user.domain=notBackslash$\\\\$actor.user.name=inParen$\\) to $dst_endpoint.interface_name=zoneName$:$dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ \\($unmapped.nat_dst_ip=addr$/$unmapped.nat_dst_port=digits$\\)",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 1, activity_name: "Open", type_uid: 400101,
        status_id: 1, status: "Success"
      }
    },

    // Without the identity-firewall user suffix.
    {
      id: "asa_built_conn",
      format: ".*%ASA-[0-7]-30201[35]: Built $unmapped.conn_direction=word$ $connection_info.protocol_name=word$ connection $connection_info.uid=digits$ for $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ \\($unmapped.nat_src_ip=addr$/$unmapped.nat_src_port=digits$\\) to $dst_endpoint.interface_name=zoneName$:$dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ \\($unmapped.nat_dst_ip=addr$/$unmapped.nat_dst_port=digits$\\)",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 1, activity_name: "Open", type_uid: 400101,
        status_id: 1, status: "Success"
      }
    },

    // =================================================================================
    // 302014 / 302016 -- Teardown TCP|UDP connection
    // 302014 carries an optional free-text teardown reason; 302016 never does.
    // Order matters: each later shape is a prefix of an earlier one, so the more
    // specific variants must be tried first.
    // =================================================================================

    {
      id: "asa_teardown_conn_user_reason",
      format: ".*%ASA-[0-7]-30201[46]: Teardown $connection_info.protocol_name=word$ connection $connection_info.uid=digits$ for $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$\\($actor.user.domain=notBackslash$\\\\$actor.user.name=inParen$\\) to $dst_endpoint.interface_name=zoneName$:$dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ duration $unmapped.duration_hms=hms$ bytes $traffic.bytes=digits$ $unmapped.teardown_reason=toParen$ \\($unmapped.session_user=inParen$\\)",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 2, activity_name: "Close", type_uid: 400102,
        status_id: 1, status: "Success"
      }
    },

    {
      id: "asa_teardown_conn_user",
      format: ".*%ASA-[0-7]-30201[46]: Teardown $connection_info.protocol_name=word$ connection $connection_info.uid=digits$ for $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$\\($actor.user.domain=notBackslash$\\\\$actor.user.name=inParen$\\) to $dst_endpoint.interface_name=zoneName$:$dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ duration $unmapped.duration_hms=hms$ bytes $traffic.bytes=digits$ \\($unmapped.session_user=inParen$\\)",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 2, activity_name: "Close", type_uid: 400102,
        status_id: 1, status: "Success"
      }
    },

    // No identity-firewall user. `$unmapped.teardown_reason$` has no pattern and no
    // following delimiter, so the default `quotable` takes the remainder of the line.
    {
      id: "asa_teardown_conn_reason",
      format: ".*%ASA-[0-7]-30201[46]: Teardown $connection_info.protocol_name=word$ connection $connection_info.uid=digits$ for $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ to $dst_endpoint.interface_name=zoneName$:$dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ duration $unmapped.duration_hms=hms$ bytes $traffic.bytes=digits$ $unmapped.teardown_reason$",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 2, activity_name: "Close", type_uid: 400102,
        status_id: 1, status: "Success"
      }
    },

    {
      id: "asa_teardown_conn",
      format: ".*%ASA-[0-7]-30201[46]: Teardown $connection_info.protocol_name=word$ connection $connection_info.uid=digits$ for $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ to $dst_endpoint.interface_name=zoneName$:$dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ duration $unmapped.duration_hms=hms$ bytes $traffic.bytes=digits$",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 2, activity_name: "Close", type_uid: 400102,
        status_id: 1, status: "Success"
      }
    },

    // =================================================================================
    // 302020 / 302021 -- Built / Teardown ICMP connection
    // faddr = foreign (off-appliance) host, laddr = local host, gaddr = mapped/global.
    // For an inbound ICMP connection the foreign host is the source.
    // The value after faddr is the ICMP identifier, not a port.
    // =================================================================================

    {
      id: "asa_built_icmp",
      format: ".*%ASA-[0-7]-302020: Built $unmapped.conn_direction=word$ ICMP [Cc]onnection for faddr $src_endpoint.ip=addr$/$unmapped.icmp_id=digits$ gaddr $unmapped.nat_dst_ip=addr$/$unmapped.gaddr_port=digits$ laddr $dst_endpoint.ip=addr$/$unmapped.laddr_port=digits$ type $unmapped.icmp_type=digits$ code $unmapped.icmp_code=digits$",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 1, activity_name: "Open", type_uid: 400101,
        status_id: 1, status: "Success",
        "connection_info.protocol_name": "ICMP"
      }
    },

    {
      id: "asa_teardown_icmp",
      format: ".*%ASA-[0-7]-302021: Teardown ICMP [Cc]onnection for faddr $src_endpoint.ip=addr$/$unmapped.icmp_id=digits$ gaddr $unmapped.nat_dst_ip=addr$/$unmapped.gaddr_port=digits$ laddr $dst_endpoint.ip=addr$/$unmapped.laddr_port=digits$ type $unmapped.icmp_type=digits$ code $unmapped.icmp_code=digits$",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 2, activity_name: "Close", type_uid: 400102,
        status_id: 1, status: "Success",
        "connection_info.protocol_name": "ICMP"
      }
    },

    // =================================================================================
    // 725001 / 725002 / 725007 / 725016 -- SSL/TLS session lifecycle.
    // OCSF has no standalone TLS class; these are Network Activity carrying `tls`.
    // =================================================================================

    // Starting SSL handshake (tls.version here is the generic family, e.g. "TLS").
    {
      id: "asa_ssl_handshake_start",
      format: ".*%ASA-[0-7]-725001: Starting SSL handshake with $unmapped.ssl_peer_type=word$ $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ to $dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ for $tls.version=tlsVer$ session",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 1, activity_name: "Open", type_uid: 400101,
        status_id: 1, status: "Success",
        "connection_info.protocol_name": "TCP"
      }
    },

    // Handshake completed -- tls.version is the negotiated version, e.g. TLSv1.2.
    {
      id: "asa_ssl_handshake_complete",
      format: ".*%ASA-[0-7]-725002: Device completed SSL handshake with $unmapped.ssl_peer_type=word$ $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ to $dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ for $tls.version=tlsVer$ session",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 1, activity_name: "Open", type_uid: 400101,
        status_id: 1, status: "Success",
        "connection_info.protocol_name": "TCP"
      }
    },

    {
      id: "asa_ssl_session_terminated",
      format: ".*%ASA-[0-7]-725007: SSL session with $unmapped.ssl_peer_type=word$ $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ to $dst_endpoint.ip=addr$/$dst_endpoint.port=digits$ terminated",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 2, activity_name: "Close", type_uid: 400102,
        status_id: 1, status: "Success",
        "connection_info.protocol_name": "TCP"
      }
    },

    // Trust-point (certificate store label) selected for the session.
    {
      id: "asa_ssl_trustpoint_selected",
      format: ".*%ASA-[0-7]-725016: Device selects trust-point $unmapped.trust_point=word$ for $unmapped.ssl_peer_type=word$ $src_endpoint.interface_name=zoneName$:$src_endpoint.ip=addr$/$src_endpoint.port=digits$ to $dst_endpoint.ip=addr$/$dst_endpoint.port=digits$",
      halt: true,
      attributes: {
        class_uid: 4001, class_name: "Network Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 99, activity_name: "Other", type_uid: 400199,
        status_id: 1, status: "Success",
        "connection_info.protocol_name": "TCP"
      }
    },

    // =================================================================================
    // 113005 / 113014 / 113015 -- AAA user authentication outcomes
    // =================================================================================

    // Rejected against a remote AAA server.
    {
      id: "asa_aaa_auth_rejected_server",
      format: ".*%ASA-[0-7]-113005: AAA user authentication $unmapped.aaa_result=word$ : reason = $status_detail=toColon$ : server = $dst_endpoint.ip=addr$ : user = $user.name=toColon$ : user IP = $src_endpoint.ip=addr$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 1, activity_name: "Logon", type_uid: 300201,
        status_id: 2, status: "Failure",
        is_remote: true
      }
    },

    // Rejected against the appliance's local user database.
    {
      id: "asa_aaa_auth_rejected_local",
      format: ".*%ASA-[0-7]-113015: AAA user authentication $unmapped.aaa_result=word$ : reason = $status_detail=toColon$ : local database : user = $user.name=toColon$ : user IP = $src_endpoint.ip=addr$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 1, activity_name: "Logon", type_uid: 300201,
        status_id: 2, status: "Failure",
        // The message carries a "user IP", so the authentication attempt arrived
        // over a remote connection. `is_remote` describes the connection, NOT where
        // the credential store lives -- the local-database fact is unmapped.aaa_source.
        is_remote: true,
        "unmapped.aaa_source": "local database"
      }
    },

    // AAA server unreachable -- the authentication attempt could not be completed.
    {
      id: "asa_aaa_server_unreachable",
      format: ".*%ASA-[0-7]-113014: AAA authentication server not accessible : server = $dst_endpoint.ip=addr$ : user = $user.name=toColon$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 1, activity_name: "Logon", type_uid: 300201,
        status_id: 2, status: "Failure",
        status_detail: "AAA authentication server not accessible"
        // No `is_remote`: 113014 carries no user IP, so whether the attempt arrived
        // over a remote connection is not knowable from the message.
      }
    },

    // =================================================================================
    // 113022 / 113023 -- AAA server health transitions.
    // Not an authentication attempt, but it is AAA infrastructure state, so it is
    // emitted as Authentication / Other rather than forced into an unrelated class.
    // =================================================================================

    {
      id: "asa_aaa_server_marked_failed",
      format: ".*%ASA-[0-7]-113022: AAA Marking $unmapped.aaa_protocol=word$ server $dst_endpoint.ip=addr$ in aaa-server group $unmapped.aaa_server_group=hostName$ as $unmapped.aaa_server_state=word$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 99, activity_name: "Other", type_uid: 300299,
        status_id: 2, status: "Failure",
        status_detail: "AAA server marked FAILED"
      }
    },

    {
      id: "asa_aaa_server_marked_active",
      format: ".*%ASA-[0-7]-113023: AAA Marking $unmapped.aaa_protocol=word$ server $dst_endpoint.ip=addr$ in aaa-server group $unmapped.aaa_server_group=hostName$ as $unmapped.aaa_server_state=word$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 99, activity_name: "Other", type_uid: 300299,
        status_id: 1, status: "Success",
        status_detail: "AAA server marked ACTIVE"
      }
    },

    // =================================================================================
    // 716038 / 716039 -- WebVPN / AnyConnect group authentication result.
    // 716038 (successful) is the documented counterpart of 716039 and is included for
    // completeness; only the 716039 (rejected) shape appears in the supplied sample.
    // =================================================================================

    {
      id: "asa_webvpn_auth_success",
      format: ".*%ASA-[0-7]-716038: Group <$unmapped.tunnel_group=inAngle$> User <$user.name=inAngle$> IP <$src_endpoint.ip=addr$> Authentication: $unmapped.auth_result=word$, Session Type: $unmapped.session_type=word$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 1, activity_name: "Logon", type_uid: 300201,
        status_id: 1, status: "Success",
        is_remote: true
      }
    },

    {
      id: "asa_webvpn_auth_rejected",
      format: ".*%ASA-[0-7]-716039: Group <$unmapped.tunnel_group=inAngle$> User <$user.name=inAngle$> IP <$src_endpoint.ip=addr$> Authentication: $unmapped.auth_result=word$, Session Type: $unmapped.session_type=word$",
      halt: true,
      attributes: {
        class_uid: 3002, class_name: "Authentication",
        category_uid: 3, category_name: "Identity & Access Management",
        activity_id: 1, activity_name: "Logon", type_uid: 300201,
        status_id: 2, status: "Failure",
        is_remote: true
      }
    },

    // =================================================================================
    // 746016 -- user-identity DNS lookup failure
    // =================================================================================

    {
      id: "asa_user_identity_dns_failed",
      format: ".*%ASA-[0-7]-746016: user-identity: DNS lookup for $query.hostname=hostName$ failed, reason:$status_detail$",
      halt: true,
      attributes: {
        class_uid: 4003, class_name: "DNS Activity",
        category_uid: 4, category_name: "Network Activity",
        activity_id: 1, activity_name: "Query", type_uid: 400301,
        status_id: 2, status: "Failure"
      }
    },

    // =================================================================================
    // 733100 -- threat detection drop-rate threshold exceeded
    // =================================================================================

    {
      id: "asa_threat_detection_drop_rate",
      format: ".*%ASA-[0-7]-733100: \\[\\s*$unmapped.threat_object=bracketWord$\\] drop rate-$unmapped.drop_rate_id=digits$ exceeded\\. Current burst rate is $unmapped.current_burst_rate=digits$ per second, max configured rate is $unmapped.max_burst_rate=digits$; Current average rate is $unmapped.current_average_rate=digits$ per second, max configured rate is $unmapped.max_average_rate=digits$; Cumulative total count is $unmapped.cumulative_drop_count=digits$",
      halt: true,
      attributes: {
        class_uid: 2004, class_name: "Detection Finding",
        category_uid: 2, category_name: "Findings",
        activity_id: 1, activity_name: "Create", type_uid: 200401,
        status_id: 1, status: "Success",
        "finding_info.title": "Threat detection drop rate exceeded",
        "finding_info.analytic.name": "Cisco ASA Threat Detection",
        "finding_info.analytic.type": "Rule"
      }
    }
  ],

  mappings: {
    version: 1,
    mappings: [
      {
        predicate: "true",
        transformations: [

          // --- ASA syslog severity (0-7) -> OCSF severity_id (0-6) ------------------
          // OCSF's string counterpart is `severity`, which SDL ingest reserves and
          // coerces through its own keyword table, so only the numeric id is emitted.
          { copy: { from: "unmapped.asa_severity", to: "severity_id" } },
          { cast: { field: "severity_id", type: "enum",
                    enum: { "0": 6, "1": 5, "2": 5, "3": 4, "4": 3, "5": 2, "6": 1, "7": 1 },
                    enum_default: 0 } },

          // --- protocol name -> IANA protocol number --------------------------------
          { copy: { from: "connection_info.protocol_name", to: "connection_info.protocol_num" } },
          { cast: { field: "connection_info.protocol_num", type: "enum",
                    enum: { "TCP": 6, "UDP": 17, "ICMP": 1 },
                    enum_default: 0 } },

          // --- ASA direction word -> OCSF direction / direction_id ------------------
          { copy: { from: "unmapped.conn_direction", to: "connection_info.direction" } },
          { copy: { from: "unmapped.conn_direction", to: "connection_info.direction_id" } },
          { cast: { field: "connection_info.direction", type: "enum",
                    enum: { "inbound": "Inbound", "outbound": "Outbound" },
                    enum_default: "Other" } },
          { cast: { field: "connection_info.direction_id", type: "enum",
                    enum: { "inbound": 1, "outbound": 2 },
                    enum_default: 99 } },

          // --- AAA transport -> OCSF auth_protocol / auth_protocol_id ---------------
          { copy: { from: "unmapped.aaa_protocol", to: "auth_protocol" } },
          { copy: { from: "unmapped.aaa_protocol", to: "auth_protocol_id" } },
          { cast: { field: "auth_protocol", type: "enum",
                    enum: { "RADIUS": "RADIUS", "TACACS+": "Other", "LDAP": "Other" },
                    enum_default: "Other" } },
          { cast: { field: "auth_protocol_id", type: "enum",
                    enum: { "RADIUS": 10 },
                    enum_default: 99 } },

          // --- WebVPN session type -> OCSF logon_type -------------------------------
          { copy: { from: "unmapped.session_type", to: "logon_type" } },

          // --- numeric coercions ----------------------------------------------------
          { cast: { field: "unmapped.syslog_priority",      type: "int" } },
          { cast: { field: "src_endpoint.port",             type: "int" } },
          { cast: { field: "dst_endpoint.port",             type: "int" } },
          { cast: { field: "traffic.bytes",                 type: "int" } },
          // NOT OCSF `count`: that means "how many times this event occurred", whereas
          // Cisco's "Cumulative total count" is a cumulative dropped-packet counter.
          { cast: { field: "unmapped.cumulative_drop_count", type: "int" } },
          { cast: { field: "unmapped.icmp_type",            type: "int" } },
          { cast: { field: "unmapped.icmp_code",            type: "int" } },
          { cast: { field: "unmapped.nat_src_port",         type: "int" } },
          { cast: { field: "unmapped.nat_dst_port",         type: "int" } },
          { cast: { field: "unmapped.current_burst_rate",   type: "int" } },
          { cast: { field: "unmapped.max_burst_rate",       type: "int" } },
          { cast: { field: "unmapped.current_average_rate", type: "int" } },
          { cast: { field: "unmapped.max_average_rate",     type: "int" } },

          // --- drop the format-id sentinel fields -----------------------------------
          { drop: { field: "asa_frame_bare" } },
          { drop: { field: "asa_frame_device_ts" } },
          { drop: { field: "asa_frame_rfc3164" } },
          { drop: { field: "asa_built_conn_user" } },
          { drop: { field: "asa_built_conn" } },
          { drop: { field: "asa_teardown_conn_user_reason" } },
          { drop: { field: "asa_teardown_conn_user" } },
          { drop: { field: "asa_teardown_conn_reason" } },
          { drop: { field: "asa_teardown_conn" } },
          { drop: { field: "asa_built_icmp" } },
          { drop: { field: "asa_teardown_icmp" } },
          { drop: { field: "asa_ssl_handshake_start" } },
          { drop: { field: "asa_ssl_handshake_complete" } },
          { drop: { field: "asa_ssl_session_terminated" } },
          { drop: { field: "asa_ssl_trustpoint_selected" } },
          { drop: { field: "asa_aaa_auth_rejected_server" } },
          { drop: { field: "asa_aaa_auth_rejected_local" } },
          { drop: { field: "asa_aaa_server_unreachable" } },
          { drop: { field: "asa_aaa_server_marked_failed" } },
          { drop: { field: "asa_aaa_server_marked_active" } },
          { drop: { field: "asa_webvpn_auth_success" } },
          { drop: { field: "asa_webvpn_auth_rejected" } },
          { drop: { field: "asa_user_identity_dns_failed" } },
          { drop: { field: "asa_threat_detection_drop_rate" } }
        ]
      }
    ]
  }
}
