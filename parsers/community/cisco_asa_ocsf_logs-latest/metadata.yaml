metadata_details:
  purpose: "Parser for Cisco ASA firewall syslog, normalised to OCSF (Network Activity, Authentication, DNS Activity, Detection Finding)."
  datasource_vendor: "Cisco"
  dataSource: "Cisco ASA"
  format: "syslog"
  ingestion_method: syslog
  dependency_summary: "Requires ASA syslog forwarding with message ids in the %ASA-<severity>-<id> format."
  performance_impact: "Minimal - one frame match plus one halting format per message id."
  tags: "cisco, asa, firewall, vpn, syslog, ocsf, parser"
  version: "1.0.2"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
