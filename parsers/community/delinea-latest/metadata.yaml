metadata_details:
  purpose: "Parser for Delinea Secret Server audit events (CEF over syslog), normalised to OCSF Authentication, Account Change and related classes."
  datasource_vendor: "Delinea"
  dataSource: "Secret Server"
  format: "cef"
  ingestion_method: syslog
  dependency_summary: "Requires Secret Server to send CEF audit events over syslog."
  performance_impact: "Minimal - one CEF frame match plus per-signature formats."
  tags: "delinea, thycotic, secret-server, cef, syslog, ocsf, parser"
  version: "1.2.1"
  author: "Mario Ciccarelli (mario.ciccarelli@sentinelone.com)"
